function runCustomer(){

const SB_URL='https://yyymlcpgsbpsgaacesxr.supabase.co';
const SB_KEY='sb_publishable_Q3QiDqCjdOj-CiASHEvO0A_Jdp1L1R-';
const db=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const _ap=Element.prototype.append;Element.prototype.append=function(...c){return _ap.apply(this,c.filter(x=>x!==false&&x!=null))};
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){const v=a[k];if(v==null||v===false)continue;
  if(k==='class')e.className=v;else if(k.startsWith('on'))e[k]=v;else e.setAttribute(k,v)}

  return h('div',{},L.map(l=>{
    const num=((ar(l).match(/\d[\d\s-]{8,}\d/)||[''])[0]).replace(/[\s-]/g,'');
    return h('div',{class:'pay'},h('span',{},l),num&&h('button',{class:'cp',onclick:e=>{
      navigator.clipboard.writeText(num).then(()=>{e.target.textContent='تم النسخ ✓'}).catch(()=>{e.target.textContent=num})}},'نسخ الرقم'));
  }));
}

const imgUrl=p=>SB_URL+'/storage/v1/object/public/items/'+p;
const minDate=()=>ymd(new Date(Date.now()+Math.ceil((M.lead_hours||0)/24)*864e5));
function compress(f){return new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(new Error('x')),'image/jpeg',.7)};im.onerror=()=>no(new Error('img'));im.src=fr.result};fr.onerror=()=>no(new Error('read'));fr.readAsDataURL(f)})}
let proof=null;

async function load(){
  const app=$('app');
  if(!slug){app.textContent='رابط غير صحيح.';return}
  const {data:m}=await db.from('public_merchants').select('*').eq('slug',slug).maybeSingle();
  if(!m){app.textContent='هذه الصفحة غير متاحة حاليًا.';return}

  const {data:it}=await db.from('public_items').select('*').eq('merchant_id',m.id).order('name');
  items=it||[];draw();
}
function draw(){
  const app=$('app');app.textContent='';
  app.append(h('h1',{},M.name),M.activity&&h('p',{class:'sub'},M.activity),
    M.fixed_prices&&M.fixed_msg&&h('div',{class:'note'},M.fixed_msg),
    M.days&&h('div',{class:'note'},'التوصيل / المواعيد: '+M.days),
    M.delivery_note&&h('div',{class:'note'},'🚚 '+M.delivery_note),
    M.deposit_pct>0&&h('div',{class:'note'},'العربون: '+M.deposit_pct+'٪ من قيمة الطلب، وتظهر لك أرقام التحويل عند اختيار طلبك.'),
    h('div',{id:'list'}),
    h('div',{class:'box'},field('cn','الاسم ثلاثي (مطلوب)','محمد أحمد علي'),field('cp','رقم موبايلك (مطلوب)','01xxxxxxxxx','tel'),
      field('cp2','رقم تاني لتأكيد الطلب (غير رقمك)','','tel'),h('b',{},'العنوان بالتفصيل'),
      field('a1','المحافظة'),field('a2','المدينة'),field('a3','القرية أو الحي'),field('a4','الشارع'),field('a5','رقم المنزل، بجوار كذا أو أمام كذا'),field('nt','ملاحظات (اختياري)')),
    h('div',{id:'bk',class:'box red hide'},h('b',{},'⚠ حجز مسبق: انتبه للموعد'),h('label',{for:'bd'},'موعد الاستلام المطلوب'),h('input',{id:'bd',type:'date'}),h('p',{id:'bl'})),
    h('div',{id:'dp',class:'box hide'}),
    h('div',{id:'pfb',class:'box hide'},h('label',{for:'pf'},'صورة (سكرين شوت) تحويل العربون — مطلوبة قبل إرسال الطلب'),h('input',{id:'pf',type:'file',accept:'image/*'}),h('img',{id:'pv',class:'hide',alt:'معاينة صورة التحويل'})),
    h('div',{id:'rf',class:'box blue hide'}),
    h('div',{class:'tot'},h('span',{},'الإجمالي'),h('span',{id:'sum'},'٠ جنيه')),
    h('div',{id:'err',class:'err hide',role:'alert'}),h('button',{class:'b1',id:'go',onclick:send},'أرسل الطلب'));
  $('pf').onchange=async e=>{const f=e.target.files[0];proof=null;$('pv').classList.add('hide');if(!f)return;
    try{proof=await compress(f);$('pv').src=URL.createObjectURL(proof);$('pv').classList.remove('hide')}
    catch(x){const r=$('err');r.textContent='تعذّر قراءة الصورة، جرّب صورة أخرى';r.classList.remove('hide')}};
  list();upd();
}
function list(){
  const l=$('list');l.textContent='';
  if(!items.length){l.append(h('div',{class:'note'},'لا توجد أصناف حاليًا.'));return}
  const ord=k=>k==='ready'?0:k==='booking'?2:1;
  [...items].sort((a,b)=>ord(a.kind)-ord(b.kind)).forEach(it=>{
    const set=d=>{cart[it.id]=Math.max(0,(cart[it.id]||0)+d);list();upd()};
    l.append(h('div',{class:'dish'},
      it.image_path&&h('img',{class:'pic',src:imgUrl(it.image_path),alt:it.name,loading:'lazy',onclick:()=>window.open(imgUrl(it.image_path),'_blank')}),
      h('div',{class:'i'},h('b',{},it.name),h('span',{},fmt(it.price)+' جنيه'),
        it.kind==='ready'&&h('em',{class:'tag'},'⚡ جاهز فوري'),it.kind==='booking'&&h('em',{class:'tag k'},'📅 حجز مسبق')),
      h('div',{class:'q'},h('button',{class:'m','aria-label':'أنقص',onclick:()=>set(-1)},'−'),h('i',{},fmt(cart[it.id]||0)),h('button',{'aria-label':'زد',onclick:()=>set(1)},'+'))));
  });
}
function upd(){
  const sel=items.filter(i=>cart[i.id]>0),t=sel.reduce((a,i)=>a+i.price*cart[i.id],0),dep=Math.ceil(t*M.deposit_pct/100);
  $('sum').textContent=fmt(t)+' جنيه';
  const bk=sel.some(i=>i.kind==='booking');$('bk').classList.toggle('hide',!bk);
  const lh=M.lead_hours||0;
  $('bl').textContent='هذا حجز مسبق وليس فوريًا. '+(lh?'لا يُقبل موعد قبل '+fmt(lh)+' ساعة على الأقل من الآن، وأقرب موعد متاح: '+minDate()+'.':'اختر الموعد المناسب.');
  $('bd').min=minDate();
  const d=$('dp');d.classList.toggle('hide',!(t&&dep>0));$('pfb').classList.toggle('hide',!(t&&M.deposit_pct>0));
  d.textContent='';if(dep>0)d.append(h('b',{},'العربون المطلوب: '+fmt(dep)+' جنيه'),h('p',{},'حوّله على أحد الأرقام التالية، ثم أرفق صورة التحويل بالأسفل قبل إرسال الطلب:'),payList());

  if(M.refund_text)r.append(h('b',{},'سياسة الاسترداد'),h('p',{},M.refund_text));
}
async function send(){
  const err=m=>{const e=$('err');e.textContent=m;e.classList.toggle('hide',!m);if(m)e.scrollIntoView({block:'center'});return false};
  const v=id=>$(id).value.trim();
  const sel=items.filter(i=>cart[i.id]>0),total=sel.reduce((a,i)=>a+i.price*cart[i.id],0);
  if(!sel.length)return err('اختر صنفًا واحدًا على الأقل');
  if(M.min_order&&total<M.min_order)return err('أقل قيمة للطلب '+fmt(M.min_order)+' جنيه');
  if(v('cn').split(/\s+/).filter(Boolean).length<3)return err('اكتب اسمك ثلاثيًا');
  const p1=dg(v('cp')),p2=dg(v('cp2'));
  if(p1.length<10||p2.length<10)return err('اكتب رقمي موبايل صحيحين');
  if(p1===p2)return err('الرقم التاني لازم يكون غير رقمك');

  const bk=sel.some(i=>i.kind==='booking');
  if(bk&&!$('bd').value)return err('اختر موعد الاستلام المطلوب');
  if(bk&&$('bd').value<minDate())return err('أقرب موعد متاح للحجز هو '+minDate());
  if(M.deposit_pct>0&&!proof)return err('أرفق صورة تحويل العربون قبل إرسال الطلب');
  err('');const go=$('go');go.disabled=true;go.textContent='جارٍ الإرسال...';
  let pp=null;
  if(proof){
    pp=M.id+'/'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2))+'.jpg';
    const up=await db.storage.from('proofs').upload(pp,proof,{contentType:'image/jpeg'});
    if(up.error){go.disabled=false;go.textContent='أرسل الطلب';return err('تعذّر رفع صورة التحويل، حاول مرة أخرى.')}
  }
  const {data,error}=await db.rpc('place_order',{p_slug:slug,p_name:v('cn'),p_phone:v('cp'),p_phone2:v('cp2'),
    p_address:A.map(([k,n])=>n+': '+v(k)).join(' - '),p_notes:v('nt'),
    p_lines:sel.map(i=>({item_id:i.id,qty:cart[i.id]})),p_booking:bk?$('bd').value:null,p_proof:pp});
  go.disabled=false;go.textContent='أرسل الطلب';
  if(error){const m=error.message||'';
    return err(m.includes('blocked')?'عذرًا، لا نستطيع استقبال طلبك حاليًا.':m.includes('below_min')?'قيمة الطلب أقل من الحد الأدنى.':m.includes('bad_input')?'راجع الاسم وأرقام الموبايل.':m.includes('booking_too_soon')?'موعد الحجز قريب جدًا، اختر موعدًا لاحقًا.':m.includes('proof_required')?'أرفق صورة تحويل العربون قبل الإرسال.':'تعذّر إرسال الطلب، حاول مرة أخرى.')}
  done(data||{},v('cn'));
}
function done(r,name){
  const dep=r.deposit||0,app=$('app');app.textContent='';
  const msg='مرحبًا، أنا '+name+'. رقم طلبي #'+(r.order_no||'')+(dep>0?'، وحوّلت العربون ('+dep+' جنيه) وأرفقت صورة التحويل في الموقع.':'.');
  app.append(h('h1',{},'✓ تم استلام طلبك'),h('div',{class:'note'},'رقم طلبك: #'+(r.order_no||'')+' (احتفظ به)'),
    h('p',{class:'sub'},'سيتواصل معك '+M.name+' لتأكيد الطلب.'),
    dep>0&&h('div',{class:'box'},h('b',{},'العربون المحسوب: '+fmt(dep)+' جنيه'),h('p',{},'تم رفع صورة التحويل. لو حوّلت أقل من هذا المبلغ، سيتواصل معك التاجر. أرقام التحويل:'),payList()),
    dep>0&&M.refund_text&&h('div',{class:'box blue'},h('b',{},'سياسة الاسترداد'),h('p',{},M.refund_text)),
    M.whatsapp&&h('a',{class:'b1',href:'https://wa.me/'+wa(M.whatsapp)+'?text='+encodeURIComponent(msg),target:'_blank',rel:'noopener'},'تواصل مع التاجر على واتساب'));
}
load();

}

const SB_URL='https://yyymlcpgsbpsgaacesxr.supabase.co';

const db=supabase.createClient(SB_URL,SB_KEY);

  if(k==='class')e.className=v;else if(k.startsWith('on'))e[k]=v;else e.setAttribute(k,v)}
  c.flat().filter(x=>x!=null&&x!==false).forEach(x=>e.append(x.nodeType?x:document.createTextNode(x)));return e};
const fmt=n=>Number(n).toLocaleString('ar-EG'),dg=s=>(s||'').replace(/\D/g,'');
const SN=['جديد','جاري التنفيذ','تم التسليم','لم يُستلم'];
let U=null,M=null,tab='orders',timer=null;
const toast=t=>{const e=$('toast');e.textContent=t;e.classList.remove('hide');setTimeout(()=>e.classList.add('hide'),3500)};
let armed=null;
const two=(label,fn,ct)=>{const b=h('button',{class:'dg'},label);
  b.onclick=()=>{if(armed===b){armed=null;fn();return}armed=b;b.textContent=ct;b.classList.add('arm');
    setTimeout(()=>{if(armed===b){armed=null;b.textContent=label;b.classList.remove('arm')}},4000)};return b};
const inp=(id,l,v='',t='text')=>h('div',{},h('label',{for:id},l),h('input',{id,type:t,value:v}));
const _y=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const _i=p=>SB_URL+'/storage/v1/object/public/items/'+p;
function compress(f){return new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(new Error('x')),'image/jpeg',.7)};im.onerror=()=>no(new Error('img'));im.src=fr.result};fr.onerror=()=>no(new Error('read'));fr.readAsDataURL(f)})}

async function boot(){
  clearInterval(timer);
  const {data:{session}}=await db.auth.getSession();U=session?session.user:null;
  if(!U)return authView();
  const {data}=await db.from('merchants').select('*').eq('id',U.id).maybeSingle();
  M=data;M?main():onboard();
}
function authView(){
  const a=$('app');a.textContent='';
  const go=async up=>{
    const email=$('em').value.trim(),password=$('pw').value;
    if(!email||password.length<6)return toast('اكتب البريد وكلمة سر 6 أحرف على الأقل');
    const r=up?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});
    if(r.error)return toast(r.error.message);
    if(up&&!r.data.session)return toast('تحقق من بريدك لتأكيد الحساب ثم سجّل الدخول');
    boot();
  };
  a.append(h('h1',{},'لوحة التاجر'),h('div',{class:'box'},inp('em','البريد الإلكتروني','','email'),inp('pw','كلمة السر (6 أحرف على الأقل)','','password'),
    h('button',{class:'b1 w',onclick:()=>go(false)},'دخول'),h('p'),h('button',{class:'b2 w',onclick:()=>go(true)},'إنشاء حساب جديد')));
}
function onboard(){
  const a=$('app');a.textContent='';
  a.append(h('h1',{},'إعداد متجرك'),h('div',{class:'box'},inp('sl','اسم الرابط بالإنجليزي (حروف صغيرة وأرقام وشرطة)','','text'),inp('nm','اسم المتجر'),inp('wa','رقم واتساب الطلبات','','tel'),
    h('button',{class:'b1 w',onclick:async()=>{
      const slug=$('sl').value.trim().toLowerCase();
      if(!/^[a-z0-9-]{3,30}$/.test(slug))return toast('الرابط: 3 إلى 30 حرفًا إنجليزيًا صغيرًا أو أرقامًا أو شرطة');
      const {error}=await db.from('merchants').insert({id:U.id,slug,name:$('nm').value.trim(),whatsapp:$('wa').value.trim()});
      if(error)return toast(error.code==='23505'?'هذا الرابط مستخدم، اختر غيره':error.message);
      boot();}},'حفظ'),h('p'),h('button',{class:'b2 w',onclick:()=>db.auth.signOut().then(boot)},'خروج')));
}
function main(){
  const a=$('app');a.textContent='';
  a.append(h('div',{style:'display:flex;justify-content:space-between;align-items:center'},h('h1',{},M.name||M.slug),h('button',{class:'b2',onclick:()=>db.auth.signOut().then(boot)},'خروج')),
    !M.active&&h('div',{class:'note'},'حسابك بانتظار التفعيل، ولن يرى العملاء صفحتك قبله.'),
    h('div',{class:'tabs',id:'tb'}),h('div',{id:'c'}));
  const T=[['orders','الطلبات',vOrders],['items','القائمة',vItems],['set','الإعدادات',vSet],['bl','الحظر',vBlock],['link','الرابط']];
  T.forEach(([k,l])=>$('tb').append(h('button',{class:tab===k?'on':'',onclick:()=>{tab=k;main()}},l)));
  clearInterval(timer);
  if(tab==='orders'){vOrders();timer=setInterval(vOrders,30000)}else if(tab==='items')vItems();else if(tab==='set')vSet();else if(tab==='bl')vBlock();else vLink();
}
async function vOrders(){
  const c=$('c');if(!c||tab!=='orders')return;
  const {data,error}=await db.from('orders').select('*').order('created_at',{ascending:false}).limit(200);
  if(error){c.textContent='خطأ: '+error.message;return}
  c.textContent='';
  c.append(h('div',{class:'note'},'📩 الطلبات: '+fmt(data.length)+'\n🆕 جديدة: '+fmt(data.filter(o=>o.status===0).length)+'\n⏳ بانتظار تأكيد العربون: '+fmt(data.filter(o=>o.deposit>0&&!o.deposit_confirmed&&o.status!==3).length)),
    h('button',{class:'b2 w',onclick:vOrders},'تحديث'));
  if(!data.length)c.append(h('p',{class:'pl'},'لا توجد طلبات بعد.'));
  const g={};data.forEach(o=>{const k=new Date(o.created_at).toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});(g[k]=g[k]||[]).push(o)});
  for(const k in g){const L=g[k];
    c.append(h('div',{class:'dh'},h('b',{},k),h('span',{},fmt(L.length)+' طلب · '+fmt(L.filter(o=>o.status!==3).reduce((s,o)=>s+o.total,0))+' جنيه')),...L.map(card))}
}
const upO=async(id,p)=>{const {error}=await db.from('orders').update(p).eq('id',id);if(error)toast(error.message);vOrders()};
function card(o){
  const tm=new Date(o.created_at).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
  return h('div',{class:'od'},h('h3',{},(o.order_no?'#'+o.order_no+' · ':'')+o.customer_name),
    h('p',{class:'pl'},'📞 '+o.phone+'\n☎ رقم التأكيد: '+o.phone2+'\n📍 '+String(o.address).split(' - ').join('\n')+(o.notes?'\n📝 '+o.notes:'')+'\n🕐 '+tm),
    h('p',{class:'pl'},o.lines.map(l=>'• '+l.name+' × '+l.qty+' = '+fmt(l.price*l.qty)).join('\n')+(o.booking_date?'\n📅 حجز مسبق، الموعد: '+o.booking_date:'')),
    h('b',{},fmt(o.total)+' جنيه'),
    o.deposit>0&&h('p',{class:'pl'},'💰 العربون: '+fmt(o.deposit)+' جنيه\n'+(o.deposit_confirmed?'✅ تم التأكد من وصوله':'⏳ لم يُؤكَّد بعد')),
    o.proof_path&&h('button',{class:'b2 w',onclick:async e=>{const b=e.target;
      const {data,error}=await db.storage.from('proofs').createSignedUrl(o.proof_path,3600);
      if(error)return toast(error.message);
      b.replaceWith(h('img',{src:data.signedUrl,alt:'صورة التحويل',style:'width:100%;border-radius:10px;margin:6px 0'}))}},'🖼 عرض صورة التحويل'),
    o.deposit>0&&h('button',{class:'b2 w',onclick:()=>upO(o.id,{deposit_confirmed:!o.deposit_confirmed})},o.deposit_confirmed?'إلغاء التأكيد':'تأكدت من وصول العربون'),
    h('div',{class:'st'},SN.map((n,k)=>h('button',{class:o.status===k?'on':'',onclick:()=>{
      if(k===1&&o.deposit>0&&!o.deposit_confirmed)return toast('أكّد وصول العربون أولًا');upO(o.id,{status:k})}},n))),
    h('div',{class:'st'},two('حظر العميل',async()=>{
      const r=[...new Set([dg(o.phone),dg(o.phone2)])].map(p=>({merchant_id:M.id,phone:p,reason:'من الطلبات'}));
      const {error}=await db.from('blocked').upsert(r);toast(error?error.message:'تم حظر الرقمين')},'اضغط للحظر'),
      two('حذف الطلب',async()=>{await db.from('orders').delete().eq('id',o.id);vOrders()},'اضغط للحذف')));
}
async function vItems(){
  const c=$('c'),{data}=await db.from('items').select('*').eq('merchant_id',M.id).order('created_at');
  c.textContent='';c.append(h('p',{class:'pl'},'📷 اضغط على المربع لإضافة صورة المنتج من معرض الصور.\n⚡ فوري: جاهز الآن. 📅 حجز: يحتاج موعدًا مسبقًا.'));
  (data||[]).forEach(it=>{
    const sv=p=>db.from('items').update(p).eq('id',it.id).then(r=>{if(r.error)toast(r.error.message)});
    const pick=async f=>{
      if(!f)return;
      try{
        const bl=await compress(f),path=M.id+'/'+it.id+'-'+Date.now()+'.jpg';
        const up=await db.storage.from('items').upload(path,bl,{contentType:'image/jpeg'});
        if(up.error)return toast('تعذّر رفع الصورة: '+up.error.message);
        const old=it.image_path;
        await db.from('items').update({image_path:path}).eq('id',it.id);
        if(old)db.storage.from('items').remove([old]);
        vItems();
      }catch(e){toast('تعذّر قراءة الصورة')}
    };
    c.append(h('div',{class:'box irow'},
      h('label',{class:'th'},it.image_path?h('img',{src:SB_URL+'/storage/v1/object/public/items/'+it.image_path,alt:it.name}):'📷 صورة',
        h('input',{type:'file',accept:'image/*',style:'display:none',onchange:e=>pick(e.target.files[0])})),
      h('div',{class:'if'},h('input',{value:it.name,onchange:e=>sv({name:e.target.value})}),
        h('div',{class:'row'},
          h('input',{type:'number',value:it.price,onchange:e=>sv({price:Math.max(0,Math.round(+e.target.value||0))})}),
          h('select',{onchange:e=>sv({kind:e.target.value})},[['normal','عادي'],['ready','⚡ فوري'],['booking','📅 حجز']].map(([v,l])=>h('option',{value:v,selected:it.kind===v},l))),
          two('×',async()=>{if(it.image_path)db.storage.from('items').remove([it.image_path]);await db.from('items').delete().eq('id',it.id);vItems()},'حذف؟')))));
  });
  c.append(h('button',{class:'b1 w',onclick:async()=>{const {error}=await db.from('items').insert({merchant_id:M.id,name:'صنف جديد',price:0});if(error)toast(error.message);vItems()}},'+ إضافة صنف'));
}
function vSet(){
  const c=$('c');c.textContent='';
  const F=[['name','اسم المتجر'],['activity','نشاطك'],['whatsapp','واتساب الطلبات','tel'],['days','أيام التوصيل أو المواعيد'],['deposit_pct','نسبة العربون %','number'],
    ['min_order','أقل قيمة للطلب','number'],['pay_info','أرقام استلام العربون (كل رقم في سطر)'],['lead_hours','مدة الحجز المسبق بالساعات (مثلًا 48)','number'],['delivery_note','ملاحظة التوصيل (اختياري، مثل: التوصيل 30 جنيه، أو مجاني فوق 500)'],['fixed_msg','رسالة الأسعار الثابتة']];
  c.append(h('div',{class:'box'},...F.map(([k,l,t])=>k==='pay_info'?h('div',{},h('label',{for:'f_pay_info'},l),h('textarea',{id:'f_pay_info',rows:3,placeholder:'مثال:\nفودافون كاش 01000000000\nاتصالات كاش 01100000000'},M.pay_info||'')):inp('f_'+k,l,M[k]??'',t||'text')),
    h('label',{class:'ck'},h('input',{type:'checkbox',id:'f_fixed',checked:M.fixed_prices}),'الأسعار ثابتة بدون فصال (تظهر الرسالة للعميل)'),
    h('label',{for:'f_ref'},'سياسة الاسترداد (تظهر للعميل)'),h('textarea',{id:'f_ref',rows:4},M.refund_text||''),
    h('button',{class:'b1 w',onclick:async()=>{
      const p={fixed_prices:$('f_fixed').checked,refund_text:$('f_ref').value};
      F.forEach(([k,,t])=>{const v=$('f_'+k).value;p[k]=t==='number'?Math.max(0,Math.round(+v||0)):v});
      p.deposit_pct=Math.min(100,p.deposit_pct);p.lead_time=p.lead_hours?p.lead_hours+' ساعة':'';
      const {error}=await db.from('merchants').update(p).eq('id',M.id);
      if(error)return toast(error.message);Object.assign(M,p);toast('تم الحفظ ✓')}},'حفظ الإعدادات')));
}
async function vBlock(){
  const c=$('c'),{data}=await db.from('blocked').select('*').eq('merchant_id',M.id);
  c.textContent='';
  c.append(h('div',{class:'box'},inp('bp','رقم الموبايل المراد حظره','','tel'),inp('br','السبب (اختياري)'),
    h('button',{class:'b1 w',onclick:async()=>{const p=dg($('bp').value);if(p.length<10)return toast('اكتب رقمًا صحيحًا');
      const {error}=await db.from('blocked').upsert({merchant_id:M.id,phone:p,reason:$('br').value});if(error)return toast(error.message);vBlock()}},'أضف للحظر')));
  if(!(data||[]).length)c.append(h('p',{class:'pl'},'لا يوجد أحد في قائمة الحظر.'));
  (data||[]).forEach(b=>c.append(h('div',{class:'od',style:'display:flex;justify-content:space-between;align-items:center'},h('span',{},b.phone+(b.reason?' — '+b.reason:'')),
    two('إزالة',async()=>{await db.from('blocked').delete().eq('merchant_id',M.id).eq('phone',b.phone);vBlock()},'تأكيد؟'))));
}
function vLink(){
  const c=$('c'),url=location.origin+location.pathname.replace(/[^/]*$/,'')+'?s='+M.slug;c.textContent='';
  const q=qrcode(0,'M');q.addData(url);q.make();
  const qr=h('div',{class:'qr'});qr.innerHTML=q.createSvgTag(4);
  c.append(h('div',{class:'box'},h('b',{},'رابط صفحة العملاء'),h('input',{value:url,readonly:true,onfocus:e=>e.target.select()}),
    h('button',{class:'b1 w',onclick:()=>navigator.clipboard.writeText(url).then(()=>toast('تم النسخ ✓')).catch(()=>toast('انسخه يدويًا من الخانة'))},'نسخ الرابط'),
    h('p',{class:'pl'},'الباركود (صوّره أو اطبعه):'),qr,
    !M.active&&h('p',{class:'pl'},'⚠ الصفحة لا تظهر للعملاء قبل تفعيل حسابك.')));
}
boot();

}
const isCustomer=/\/m\/[a-z0-9-]+/.test(location.pathname)||new URLSearchParams(location.search).has('s');
if(isCustomer)runCustomer();else runOwner();
</script>
